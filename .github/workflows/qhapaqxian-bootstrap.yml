name: qhapaqxian-bootstrap

on:
  push:
    branches:
      - codex/**
      - qx/**
  pull_request:

jobs:
  build-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            cpio \
            flex \
            libreadline-dev \
            zlib1g-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev \
            perl \
            pkg-config \
            qemu-system-x86
      - name: Configure
        run: ./configure --without-icu --without-ldap --without-pam --with-openssl --with-extra-version='+qhx-bootstrap'
      - name: Build
        run: make -j"$(nproc)"
      - name: Smoke version
        run: ./src/backend/postgres --version
      - name: Prepare real microvm assets
        run: |
          set -euxo pipefail
          rm -rf microvm-assets
          mkdir -p microvm-assets/rootfs
          curl -fsSL -o microvm-assets/vmlinuz-virt \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/netboot/vmlinuz-virt
          curl -fsSL -o microvm-assets/alpine-minirootfs-3.23.4-x86_64.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/alpine-minirootfs-3.23.4-x86_64.tar.gz
          tar -xzf microvm-assets/alpine-minirootfs-3.23.4-x86_64.tar.gz -C microvm-assets/rootfs
          cat > microvm-assets/rootfs/init <<'EOF'
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev 2>/dev/null || mount -t tmpfs dev /dev
          echo QX-MICROVM-BOOT-OK
          poweroff -f >/dev/null 2>&1 || reboot -f
          EOF
          chmod +x microvm-assets/rootfs/init
          (
            cd microvm-assets/rootfs
            find . -print | cpio -o -H newc | gzip -9
          ) > microvm-assets/initramfs-qx-microvm2.cpio.gz
      - name: Smoke real container runner
        env:
          QX_CONTAINER_IMAGE: alpine:3.20
          QX_DOCKER_CLI: docker
        run: |
          docker version
          docker pull "$QX_CONTAINER_IMAGE"
          cat > /tmp/qx-container.req <<EOF
          PHASE=submit
          TASK_OID=1
          GOAL_LENGTH=12
          INPUT_PRESENT=true
          TOOL=extract
          HANDLER=builtin.extract
          SANDBOX=isolated
          PRINCIPAL=extract_runner
          PRINCIPAL_RUNTIME=container
          PROVIDER=container_provider
          PROVIDER_KIND=container
          PROVIDER_ENDPOINT=container://broker/pool
          REQUIRE_ATTESTATION=true
          RECEIPT_SCHEMA=qx.receipt.v1
          RECEIPT_ALG=ed25519
          RECEIPT_NONCE=ci:container-smoke
          RECEIPT_SIGNER=$PWD/src/bin/qhapaqxian_tool_runner/qx_remote_ed25519_private.pem
          DOCKER_CLI=$QX_DOCKER_CLI
          DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
          CONTAINER_IMAGE=$QX_CONTAINER_IMAGE
          EOF
          QX_SANDBOX_PROFILE=isolated \
          QX_SANDBOX_TIMEOUT_MS=5000 \
          QX_SANDBOX_MEMORY_KB=65536 \
          QX_SANDBOX_PROCESS_LIMIT=32 \
          ./src/bin/qhapaqxian_tool_runner/qhapaqxian-tool-runner \
            --request-file /tmp/qx-container.req \
            --response-file /tmp/qx-container.resp
          grep -q '^STATUS=ok$' /tmp/qx-container.resp
          grep -q '^PRINCIPAL_RUNTIME=container$' /tmp/qx-container.resp
          grep -q '^PROVIDER_KIND=container$' /tmp/qx-container.resp
          grep -q '^ATTESTATION=container_receipt_verified$' /tmp/qx-container.resp
          grep -q 'backend_launch=docker' /tmp/qx-container.resp
      - name: Smoke real microvm runner
        env:
          QX_MICROVM_ACCEL: tcg
        run: |
          cat > /tmp/qx-microvm.req <<EOF
          PHASE=resume
          TASK_OID=2
          GOAL_LENGTH=14
          INPUT_PRESENT=true
          TOOL=summarize
          HANDLER=builtin.summarize
          SANDBOX=isolated
          PRINCIPAL=summarize_runner
          PRINCIPAL_RUNTIME=microvm
          PROVIDER=microvm_provider
          PROVIDER_KIND=microvm
          PROVIDER_ENDPOINT=microvm://broker/primary
          REQUIRE_ATTESTATION=true
          RECEIPT_SCHEMA=qx.receipt.v1
          RECEIPT_ALG=ed25519
          RECEIPT_NONCE=ci:microvm-smoke
          RECEIPT_SIGNER=$PWD/src/bin/qhapaqxian_tool_runner/qx_remote_ed25519_private.pem
          QEMU_CLI=qemu-system-x86_64
          MICROVM_KERNEL=$PWD/microvm-assets/vmlinuz-virt
          MICROVM_INITRD=$PWD/microvm-assets/initramfs-qx-microvm2.cpio.gz
          MICROVM_ACCEL=${QX_MICROVM_ACCEL}
          EOF
          QX_SANDBOX_PROFILE=isolated \
          QX_SANDBOX_TIMEOUT_MS=5000 \
          QX_SANDBOX_MEMORY_KB=262144 \
          QX_SANDBOX_PROCESS_LIMIT=4 \
          ./src/bin/qhapaqxian_tool_runner/qhapaqxian-tool-runner \
            --request-file /tmp/qx-microvm.req \
            --response-file /tmp/qx-microvm.resp
          grep -q '^STATUS=ok$' /tmp/qx-microvm.resp
          grep -q '^PRINCIPAL_RUNTIME=microvm$' /tmp/qx-microvm.resp
          grep -q '^PROVIDER_KIND=microvm$' /tmp/qx-microvm.resp
          grep -q '^ATTESTATION=microvm_receipt_verified$' /tmp/qx-microvm.resp
          grep -q 'backend_launch=qemu' /tmp/qx-microvm.resp
      - name: Run focused regressions
        env:
          QX_CONTAINER_IMAGE: alpine:3.20
          QX_DOCKER_CLI: docker
          QX_MICROVM_ACCEL: tcg
        run: |
          make -C src/test/regress check-tests TESTS=qx_stage3_agentic
          make -C contrib/qhapaqxian_output check
